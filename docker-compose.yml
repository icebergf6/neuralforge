version: "3.9"

services:
  leagueofllms:
    build: .
    container_name: leagueofllms
    ports:
      - "8088:8088"
    volumes:
      # Mount models directory so they persist between rebuilds
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
