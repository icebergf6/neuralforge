name: LeagueOfLLMs CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Python Lint & Syntax Check ─────────────────────────────────────
  python-lint:
    name: Python Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install numpy

      - name: Check Python syntax
        run: |
          python -m py_compile tools/serve.py
          python -m py_compile tools/persistent_rag.py
          python -m py_compile tools/rag_engine.py
          python -m py_compile tools/py_reference.py
          python -m py_compile tools/agent.py
          python -m py_compile tools/download_model.py
          echo "All Python files syntax OK"

  # ── Job 2: C++ Build ───────────────────────────────────────────────────────
  cpp-build:
    name: C++ Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpp-binaries-linux
          path: build/
          retention-days: 7

  # ── Job 3: Python Unit Tests ────────────────────────────────────────────────
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install numpy

      - name: Test RAG engine
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'tools')
          from persistent_rag import PersistentKnowledgeHub
          hub = PersistentKnowledgeHub(288, '/tmp/test_db.json')
          count = hub.add_document('test_doc', 'The quick brown fox jumps over the lazy dog. ' * 10)
          assert count > 0, 'Expected chunks > 0'
          results = hub.search_hybrid('quick fox', top_k=2)
          assert len(results) > 0, 'Expected search results'
          retrieved = hub.retrieve('fox', top_k=1)
          assert len(retrieved) > 0, 'Expected retrieved chunks'
          print(f'RAG Test PASSED: {count} chunks, search OK')
          "

      - name: Test Agent tools
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'tools')
          from agent import execute_tool, parse_tool_calls
          result = execute_tool('calculator', {'expression': '2+2'})
          assert result == '4', f'Expected 4, got {result}'
          result = execute_tool('get_time', {})
          assert len(result) > 5, 'Expected time string'
          calls = parse_tool_calls('TOOL[calculator](expression=\"3*7\")')
          assert len(calls) == 1, 'Expected 1 tool call'
          assert calls[0]['tool'] == 'calculator', 'Expected calculator tool'
          print('Agent Test PASSED')
          "

      - name: Test Quantization stats
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'tools')
          from persistent_rag import SemanticChunker, PersistentKnowledgeHub
          hub = PersistentKnowledgeHub(288, '/tmp/test2.json')
          text = 'This is a test. Another sentence here. And one more. ' * 20
          chunks = hub.chunker.chunk(text)
          assert len(chunks) > 0, 'Expected semantic chunks'
          print(f'SemanticChunker PASSED: {len(chunks)} chunks from text')
          "

  # ── Job 4: Benchmark Report ─────────────────────────────────────────────────
  benchmark:
    name: Python Inference Benchmark
    runs-on: ubuntu-latest
    needs: python-tests
    # Only run on main branch pushes (not PRs) to save CI minutes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install numpy

      - name: Download tiny model for benchmark
        run: |
          mkdir -p models
          curl -L -o models/stories15M.bin \
            "https://huggingface.co/karpathy/tinyllamas/resolve/main/stories15M.bin" \
            --retry 3 --retry-delay 5 || echo "Model download skipped (network)"
          curl -L -o models/tokenizer.bin \
            "https://github.com/karpathy/llama2.c/raw/master/tokenizer.bin" \
            --retry 3 --retry-delay 5 || echo "Tokenizer download skipped"

      - name: Run inference benchmark
        run: |
          python -c "
          import sys, os, time
          sys.path.insert(0, 'tools')

          model_path = 'models/stories15M.bin'
          if not os.path.exists(model_path):
              print('Model not found, skipping benchmark.')
              sys.exit(0)

          from py_reference import PyEngine, softmax
          import numpy as np

          print('Loading engine...')
          t0  = time.time()
          eng = PyEngine(model_path, 'models/tokenizer.bin')
          load_time = time.time() - t0
          print(f'Model loaded in {load_time:.2f}s')

          # Benchmark: generate 20 tokens
          tokens = eng.tokenizer.encode('Once upon a time')
          pos = 0; token = tokens[0]; prompt_len = len(tokens)
          t1  = time.time()
          for i in range(20):
              logits = eng.forward(token, pos)
              if pos + 1 < prompt_len:
                  token = tokens[pos+1]
              else:
                  probs = softmax(logits / 0.7)
                  token = int(np.random.choice(len(probs), p=probs))
              pos += 1
          elapsed = time.time() - t1
          tps     = 20 / elapsed

          print(f'=== BENCHMARK RESULTS ===')
          print(f'Tokens/sec:    {tps:.1f}')
          print(f'Latency/token: {elapsed/20*1000:.1f} ms')
          print(f'Threads:       1 (Python reference)')
          print(f'Model:         stories15M ({eng.cfg.dim}d, {eng.cfg.n_layers}L)')
          "

  # ── Job 5: Docker Build ─────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: python-lint
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t leagueofllms:ci .

      - name: Test Docker image starts
        run: |
          # Start container without model (should print error message, not crash hard)
          docker run --rm -e PYTHONPATH=/app/tools \
            leagueofllms:ci python -c "print('Docker image OK')"
